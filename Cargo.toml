[workspace]
resolver = "2"
members = ["crates/frugalrgb-core", "crates/frugalrgb"]

[workspace.package]
version = "0.4.0-dev"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/emaspa/frugalRGB"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
