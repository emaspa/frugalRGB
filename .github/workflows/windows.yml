name: windows

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-zip:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build zip
        run: powershell -ExecutionPolicy Bypass -File packaging\build_windows.ps1

      - name: Smoke test
        run: |
          dist\frugalRGB\frugalRGB.exe --version | Out-Host
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frugalrgb-windows
          path: dist/*.zip

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" (Get-ChildItem dist\*.zip).FullName --clobber
