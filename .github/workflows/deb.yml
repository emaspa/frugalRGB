name: deb

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-deb:
    # The oldest runner, so the package also installs on older releases
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev libfontconfig1-dev

      - name: Build .deb
        run: bash packaging/build_deb.sh

      - name: Smoke-test install
        run: |
          sudo apt-get install -y ./dist/frugalrgb_*.deb
          frugalrgb --version
          frugalrgb presets

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frugalrgb-deb
          path: dist/*.deb

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.deb --clobber
