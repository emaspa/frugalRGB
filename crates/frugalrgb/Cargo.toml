[package]
name = "frugalrgb"
description = "Lightweight standalone RGB controller for PC hardware (no bloat, just LEDs)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["gui"]
# The window and tray icon. Without it the binary is the command line only.
gui = ["dep:slint", "dep:slint-build", "dep:ksni"]

[dependencies]
frugalrgb-core = { path = "../frugalrgb-core" }
log = { version = "0.4", features = ["std"] }
# Software renderer only: an OpenGL context costs more memory than the
# whole rest of the program (164 MB against 21 MB, measured)
slint = { version = "1.18", optional = true, default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
    "system-tray",
    # For handing a tray click's activation token to the window it opens
    "unstable-winit-030",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The tray icon on Linux; the same crate and features Slint uses itself
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.7", optional = true, default-features = false, features = ["async-io", "blocking"] }

[build-dependencies]
slint-build = { version = "1.18", optional = true }

# Puts the icon into the .exe
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
